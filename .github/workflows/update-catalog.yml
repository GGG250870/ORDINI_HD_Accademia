name: Aggiorna catalogo HDNails

on:
  workflow_dispatch:
  schedule:
    - cron: '20 4 * * *'
  push:
    paths:
      - 'scripts/scrape_hdnails.py'
      - 'requirements-scraper.txt'
      - '.github/workflows/update-catalog.yml'

permissions:
  contents: write

concurrency:
  group: update-hdnails-catalog
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-scraper.txt

      - name: Dipendenze
        run: pip install -r requirements-scraper.txt

      - name: Scraping hdnails.it
        env:
          MAX_WORKERS: '10'
          TIMEOUT: '30'
        run: python scripts/scrape_hdnails.py

      - name: Verifica file
        run: |
          python - <<'PY'
          import json, csv
          data=json.load(open('prodotti.json',encoding='utf-8'))
          print('Prodotti JSON:',len(data))
          assert len(data) >= 50, 'Catalogo troppo piccolo'
          with open('prodotti.csv',encoding='utf-8-sig') as f:
              rows=sum(1 for _ in csv.reader(f,delimiter=';'))-1
          print('Prodotti CSV:',rows)
          assert rows == len(data)
          PY

      - name: Pubblica catalogo aggiornato
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prodotti.json prodotti.csv
          if git diff --cached --quiet; then
            echo 'Catalogo già aggiornato.'
          else
            git commit -m 'Aggiorna catalogo HDNails'
            git push
          fi
