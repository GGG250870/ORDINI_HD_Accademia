name: Aggiorna catalogo HDNails

on:
  workflow_dispatch:
  schedule:
    # GitHub usa UTC. 04:00 UTC copre le 06:00 in ora legale,
    # 05:00 UTC copre le 06:00 in ora solare.
    - cron: '0 4,5 * * *'
  push:
    paths:
      - 'scripts/scrape_hdnails.py'
      - 'scripts/update_app_catalog.py'
      - 'requirements-scraper.txt'
      - '.github/workflows/update-catalog.yml'

permissions:
  contents: write

concurrency:
  group: update-hdnails-catalog
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Esegui solo alle 06:00 italiane
        if: github.event_name == 'schedule'
        run: |
          HOUR=$(TZ=Europe/Rome date +%H)
          if [ "$HOUR" != "06" ]; then
            echo "Ora italiana: $HOUR, esco."
            exit 0
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-scraper.txt

      - name: Dipendenze
        run: pip install -r requirements-scraper.txt

      - name: Verifica script
        run: python -m py_compile scripts/scrape_hdnails.py scripts/update_app_catalog.py

      - name: Scraping hdnails.it
        env:
          MAX_WORKERS: '10'
          TIMEOUT: '30'
        run: python scripts/scrape_hdnails.py

      - name: Verifica file catalogo
        run: |
          python - <<'PY'
          import json, csv
          data=json.load(open('prodotti.json',encoding='utf-8'))
          print('Prodotti JSON:',len(data))
          assert len(data) >= 50, 'Catalogo troppo piccolo'
          with open('prodotti.csv',encoding='utf-8-sig') as f:
              rows=sum(1 for _ in csv.reader(f,delimiter=';'))-1
          print('Prodotti CSV:',rows)
          assert rows == len(data)
          PY

      - name: Aggiorna app e popup novita
        run: python scripts/update_app_catalog.py

      - name: Pubblica aggiornamenti
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prodotti.json prodotti.csv catalog_monitor_state.json catalog_patch.js index.html sw.js .nojekyll
          if git diff --cached --quiet; then
            echo 'Nessun aggiornamento da pubblicare.'
          else
            git commit -m 'Aggiorna catalogo HDNails e app'
            git push
          fi
