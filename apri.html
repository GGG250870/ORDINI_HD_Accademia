<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Apertura app</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#1a1a1a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif;text-align:center;padding:22px}main{max-width:360px}h1{font-size:22px;margin:0 0 8px}p{font-size:15px;line-height:1.35;color:#ddd;margin:0 0 18px}button{border:0;border-radius:14px;background:#e4007f;color:#fff;min-height:48px;padding:0 18px;font-size:15px;font-weight:900}</style>
</head>
<body>
<main>
<h1>Apertura app</h1>
<p>Aggiornamento in corso. Tra pochi secondi si apre il catalogo aggiornato.</p>
<button id="open" type="button">Apri ora</button>
</main>
<script>
(async function(){
  async function clean(){
    try{if('caches' in window){let keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)))}}catch(e){}
    try{if('serviceWorker' in navigator){let regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()))}}catch(e){}
    try{
      Object.keys(localStorage).forEach(k=>{if(/^hd_(app_version|auto_reload|news_seen|products|catalog_news)/.test(k))localStorage.removeItem(k)})
    }catch(e){}
  }
  async function go(){
    await clean();
    location.replace('./?fresh='+Date.now());
  }
  document.getElementById('open').addEventListener('click',go);
  setTimeout(go,900);
})();
</script>
</body>
</html>
